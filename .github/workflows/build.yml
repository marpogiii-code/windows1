name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "beast0823/mar"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          #tags: "${{ secrets.DOCKER_USER }}/windows1:latest"
          tags: "beast0823/ranmar:latest"
          #outputs: ${{ github.event_name == 'push_request' && 'type=cacheonly' || 'type=registry' }}
          outputs: ${{ github.event_name == 'pull' && 'push' || 'type=registry' }}
  
